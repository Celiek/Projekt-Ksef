spring.application.name=api-gateway
server.port=8087
# ksef producer

spring.cloud.gateway.server.webflux.routes[0].id=producer-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/dokument/**

spring.cloud.gateway.server.webflux.routes[1].id=pdf-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/pdf/**

spring.cloud.gateway.server.webflux.routes[2].id=metadata-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/meta/**

#security
spring.security.oauth2.resourceserver.jwt.issuer-uri: http://localhost:8089/realms/ksef